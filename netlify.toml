# Eventide Omega — Netlify = website only.
# /api is proxied to the Pterodactyl panel (persistent disk).
# Render does not use this file.

[build]
  publish = "public"
  command = "echo static-public"

[[redirects]]
  from = "/api/*"
  to = "http://45.151.122.219:3068/api/:splat"
  status = 200
  force = true
